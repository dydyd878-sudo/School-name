function exRow(e,s){var d=dl(e[0]),c=d<0?'var(--sub)':d<=2?'#ff453a':d<=7?'#ff9f0a':'var(--ac)';return '<div class="row" style="'+(d<0?'opacity:.45':'')+'">'+(s?'<div class="num">\ud83d\udcdd</div>':'')+'<div class="t">'+esc(s?e[1]:e[2])+'<div class="s2">'+(s?esc(e[2])+' · ':'')+dfx(e[0])+'</div></div><div class="dn" style="color:'+c+'">'+(d<0?'✓ עבר':dtx(d))+'</div></div>'}
function exNext(){return EX.filter(function(e){return dl(e[0])>=0}).sort(function(a,b){return a[0]<b[0]?-1:1})[0]}
function exCard(){var n=exNext();if(!n)return '';return '<div class="card"><small>המבחן הבא</small><div class="n">'+esc(n[1])+' · '+esc(n[2])+'</div><div class="s">'+dfx(n[0])+'</div><div class="cdn">'+dtx(dl(n[0]))+'</div></div>'}
var BK='schooltime.bus',B=(function(){try{return JSON.parse(localStorage.getItem(BK))||{}}catch(e){return{}}})(),bres='',API='https://open-bus-stride-api.hasadna.org.il';
B.stop=B.stop||'12722';B.lines=B.lines||'33,27';
function bsave(){try{localStorage.setItem(BK,JSON.stringify(B))}catch(e){}}
async function bget(p,log){var r,t;try{r=await fetch(API+p);t=await r.text()}catch(e){log.push('GET '+p+' → '+e.message);throw e}log.push('GET '+p+' → '+r.status+'\n'+t.slice(0,600));if(!r.ok)throw new Error('HTTP '+r.status);return JSON.parse(t)}
async function busGo(){
 var el=document.getElementById('bus'),log=[],out='';
 el.innerHTML='<div class="card"><div class="s">טוען…</div></div>';
 try{
  var st=await bget('/gtfs_stops/list?limit=1&order_by='+encodeURIComponent('date desc')+'&code='+encodeURIComponent(B.stop.trim()),log);
  if(!st.length)throw new Error('התחנה לא נמצאה');
  var s=st[0],la=+s.lat,lo=+s.lon,d=.01;
  out+='<div class="card"><small>תחנה '+esc(String(s.code))+'</small><div class="n">'+esc(s.name||'')+'</div><div class="s">'+esc(s.city||'')+'</div></div>';
  var q='/siri_vehicle_locations/list?limit=100&order_by='+encodeURIComponent('recorded_at_time desc')+'&recorded_at_time_from='+encodeURIComponent(new Date(Date.now()-6e5).toISOString())+'&recorded_at_time_to='+encodeURIComponent(new Date().toISOString())+'&lat__greater_or_equal='+(la-d)+'&lat__lower_or_equal='+(la+d)+'&lon__greater_or_equal='+(lo-d)+'&lon__lower_or_equal='+(lo+d);
  var v=await bget(q,log),seen={},rows='';
  v.forEach(function(x){var k=x.siri_ride__vehicle_ref||x.vehicle_ref||x.id;if(seen[k])return;seen[k]=1;var ago=Math.max(0,Math.round((Date.now()-new Date(x.recorded_at_time))/6e4));rows+='<div class="row"><div class="num">🚌</div><div class="t">קו '+esc(x.siri_route__line_ref||'?')+'<div class="s2">רכב '+esc(k)+' · לפני '+ago+' דק׳</div></div><div class="dn">'+(x.velocity!=null?Math.round(x.velocity)+' קמ״ש':'')+'</div></div>'});
  out+=rows?'<div class="sec">אוטובוסים ליד התחנה (10 דקות אחרונות)</div><div class="rows">'+rows+'</div>':'<div class="card"><div class="s">לא נמצאו אוטובוסים ליד התחנה ב-10 הדקות האחרונות.</div></div>';
  var L=B.lines.split(/[ ,]+/).filter(Boolean);
  for(var i=0;i<L.length;i++){try{await bget('/gtfs_routes/list?limit=5&order_by='+encodeURIComponent('date desc')+'&route_short_name='+encodeURIComponent(L[i]),log)}catch(e){}}
 }catch(e){
  out+='<div class="card"><small>שגיאה</small><div class="n">'+(/HTTP|התחנה/.test(e.message)?esc(e.message):'הבקשה נחסמה או שאין חיבור')+'</div><div class="s">אם הדף נפתח דרך claude.ai, הגישה לממשק חסומה. הפעל את הגרסה המתאחסנת.</div></div>';
 }
 out+='<details class="card"><summary>אבחון</summary><pre style="white-space:pre-wrap;direction:ltr;font-size:11px;overflow-x:auto">'+esc(log.join('\n\n'))+'</pre></details>';
 bres=out;el.innerHTML=out;
}
function renderBus(){
 $a('<h1 style="margin-top:12px">אוטובוס</h1><div class="rows"><div class="row"><div class="t">מספר תחנה</div><input type="text" inputmode="numeric" value="'+esc(B.stop)+'" oninput="B.stop=this.value;bsave()" style="flex:0 0 110px;direction:ltr;text-align:center"></div><div class="row"><div class="t">קווים</div><input type="text" value="'+esc(B.lines)+'" oninput="B.lines=this.value;bsave()" style="flex:0 0 110px;direction:ltr;text-align:center"></div></div><button class="btn" onclick="busGo()">בדוק עכשיו</button><div id="bus">'+bres+'</div><p class="hint">גרסת ניסוי. הנתונים מגיעים מ-Open Bus Stride ומתעדכנים כפעם בדקה. האבחון מראה מה הממשק החזיר.</p>');
}
function renderEx(){
 var h='<h1 style="margin-top:12px">מבחנים ואירועים</h1><div class="chips"><button class="chip'+(exm=='sub'?' on':'')+'" onclick="exm=\'sub\';render()">מבחנים לפי מקצוע</button><button class="chip'+(exm=='date'?' on':'')+'" onclick="exm=\'date\';render()">הכל לפי תאריך</button><button class="chip'+(exm=='ev'?' on':'')+'" onclick="exm=\'ev\';render()">אירועים</button></div>';
 var L=EX.slice().sort(function(a,b){return a[0]<b[0]?-1:1});
 if(exm=='ev'){h+=evList()}else if(exm=='date'){h+=allList()}else if(0){var u=L.filter(function(e){return dl(e[0])>=0});h+=u.length?'<div class="rows">'+u.map(function(e){return exRow(e,1)}).join('')+'</div>':'<div class="card"><div class="n">אין מבחנים קרובים 🎉</div></div>'}
 else{var M={};L.forEach(function(e){(M[e[1]]=M[e[1]]||[]).push(e)});
  var f=function(k){var n=M[k].filter(function(e){return dl(e[0])>=0})[0];return n?n[0]:'9'};
  Object.keys(M).sort(function(a,b){return f(a)<f(b)?-1:f(a)>f(b)?1:0}).forEach(function(k){h+='<div class="sec">'+esc(k)+'</div><div class="rows">'+M[k].map(function(e){return exRow(e,0)}).join('')+'</div>'})}
 h+='<p class="hint">לפי לוח האירועים והמבחנים של ט׳2 תשפ״ז. ייתכנו שינויים, ויישלחו הודעות עדכון מבית הספר.</p>';
 $a(h)
}
function gv(a,d,i){return((a||[])[d]||[])[i]||''}
function inf(p){var a=[p.r?'חדר '+p.r:'',p.t].filter(Boolean);return a.length?'<div class="s">'+esc(a.join(' · '))+'</div>':''}
function yearCard(){var t=new Date((S.end||'2027-06-20')+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);var d=Math.round((t-n)/864e5);if(isNaN(d))return '';return '<div class="card"><small>'+esc(S.endLbl||'סוף שנת הלימודים')+'</small><div class="n">'+(d>0?d+' ימים':d==0?'היום! 🎉':'הגיע! 🌴')+'</div><div class="s">'+(d>0?'עד '+t.toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'})+' · כ-'+Math.ceil(d/7)+' שבועות':'')+'</div></div>'}
function cd(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return h?h+':'+pad(m)+':'+pad(r):pad(m)+':'+pad(r)}
function per(di){var r=[];S.periods.forEach(function(p,i){var s=tm(p[0])*60,e=tm(p[1])*60;if(!isNaN(s)&&!isNaN(e)&&e>s)r.push({i:i,s:s,e:e,n:((S.subjects[di]||[])[i]||'').trim()||'שיעור פנוי',a:p[0],b:p[1],r:gv(S.room,di,i).trim(),t:gv(S.teach,di,i).trim()})});return r}
function nextCard(p,txt,extra){return '<div class="card"><small>'+txt+'</small><div class="n">'+esc(p.n)+'</div><div class="s">שיעור '+(p.i+1)+' · '+p.a+'–'+p.b+'</div>'+inf(p)+(extra?'<div class="cdn">'+extra+'</div>':'')+'</div>'}
function head(d){return '<div class="date">'+d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})+'</div><h1>School Time</h1>'}
function renderNow(){
 var d=new Date(),dow=d.getDay(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),di=dow<=4?dow:-1,L=di<0?[]:per(di),h=head(d);
 var cur=L.filter(function(p){return sec>=p.s&&sec<p.e})[0];
 if(cur){
  var nx=L[L.indexOf(cur)+1],pr=(sec-cur.s)/(cur.e-cur.s)*100;
  h+='<div class="hero"><span class="pill">שיעור '+(cur.i+1)+'</span><div class="ttl">'+esc(cur.n)+'</div><div class="meta">'+cur.a+'–'+cur.b+(cur.r?' · חדר '+esc(cur.r):'')+(cur.t?' · '+esc(cur.t):'')+'</div><div class="big">'+cd(cur.e-sec)+'</div><div class="lbl">עד סוף השיעור</div><div class="bar"><i style="width:'+pr.toFixed(1)+'%"></i></div></div>';
  h+=nx?nextCard(nx,'השיעור הבא','מתחיל בעוד '+cd(nx.s-sec)+(nx.s>cur.e?' · כולל הפסקה של '+Math.round((nx.s-cur.e)/60)+' דק׳':'')):'<div class="card"><small>השיעור הבא</small><div class="n">זה השיעור האחרון להיום 🎉</div></div>';
 }else if(L.length&&sec<L[0].s){
  h+='<div class="hero idle"><span class="pill">לפני הלימודים</span><div class="ttl">בוקר טוב ☀️</div><div class="meta">השיעור הראשון: '+esc(L[0].n)+'</div><div class="big">'+cd(L[0].s-sec)+'</div><div class="lbl">עד תחילת שיעור 1</div></div>'+nextCard(L[0],'השיעור הראשון','בשעה '+L[0].a);
 }else{
  var pv=L.filter(function(p){return p.e<=sec}).pop(),nx2=L.filter(function(p){return p.s>sec})[0];
  if(pv&&nx2){
   var pr2=(sec-pv.e)/(nx2.s-pv.e)*100;
   h+='<div class="hero brk"><span class="pill">הפסקה</span><div class="ttl">הפסקה 🍎</div><div class="meta">'+pv.b+'–'+nx2.a+'</div><div class="big">'+cd(nx2.s-sec)+'</div><div class="lbl">עד סוף ההפסקה</div><div class="bar"><i style="width:'+pr2.toFixed(1)+'%"></i></div></div>'+nextCard(nx2,'השיעור הבא','מתחיל בעוד '+cd(nx2.s-sec));
  }else{
   var k=dow<=3?1:dow==4?3:dow==5?2:1,nd=dow<=3?dow+1:0,F=per(nd)[0],wk=dow>=5;
   h+='<div class="hero idle"><span class="pill">'+(wk?'סוף שבוע':'סוף יום')+'</span><div class="ttl">'+(wk?'סוף שבוע נעים 😎':'היום נגמר 🎉')+'</div><div class="meta">נתראה ב'+(k==1?'מחר':'יום '+DAYS[nd])+'</div></div>';
   if(F){var t=new Date(d);t.setDate(t.getDate()+k);t.setHours(0,0,0,0);h+=nextCard(F,'השיעור הבא · '+(k==1?'מחר':'יום '+DAYS[nd]),'בעוד '+cd((t-d)/1000+F.s))}
  }
 }
 $a(h);
}
function $a(h){document.getElementById('app').innerHTML=h+(view=='now'?exCard()+yearCard():'')}
function chips(){return '<div class="chips">'+DAYS.map(function(n,i){return '<button class="chip'+(i==sd?' on':'')+'" onclick="sd='+i+';render()">'+n+'</button>'}).join('')+'</div>'}
function renderWeek(){
 var d=new Date(),sec=d.getHours()*3600+d.getMinutes()*60+d.getSeconds(),L=per(sd),h='<h1 style="margin-top:12px">מערכת שעות</h1>'+chips()+'<div class="rows">';
 L.forEach(function(p,k){
  if(k){var g=Math.round((p.s-L[k-1].e)/60);if(g>0)h+='<div class="gap">הפסקה · '+g+' דק׳</div>'}
  var on=d.getDay()==sd&&sec>=p.s&&sec<p.e;
  h+='<div class="row'+(on?' now':'')+'"><div class="num">'+(p.i+1)+'</div><div class="t">'+esc(p.n)+(p.r||p.t?'<div style="font-weight:400;font-size:13px;color:var(--sub)">'+esc([p.r?'חדר '+p.r:'',p.t].filter(Boolean).join(' · '))+'</div>':'')+'</div><div class="tm">'+p.a+'–'+p.b+'</div></div>';
 });
 $a(h+'</div>');
}
function renderSet(){
 var h='<h1 style="margin-top:12px">הגדרות</h1><div class="sec">מקצועות · בחר יום</div>'+chips()+'<div class="rows">';
 S.periods.forEach(function(_,i){h+='<div class="row"><div class="num">'+(i+1)+'</div><div class="col"><input type="text" placeholder="שם המקצוע" value="'+esc(gv(S.subjects,sd,i))+'" oninput="setSub('+i+',this.value)"><div class="two"><input type="text" placeholder="חדר" value="'+esc(gv(S.room,sd,i))+'" oninput="setX(\'room\','+i+',this.value)"><input type="text" placeholder="מורה" value="'+esc(gv(S.teach,sd,i))+'" oninput="setX(\'teach\','+i+',this.value)"></div></div></div>'});
 h+='</div><div class="sec">זמני שיעורים (ההפסקות מחושבות אוטומטית)</div><div class="rows">';
 S.periods.forEach(function(p,i){
  if(i){var g=tm(p[0])-tm(S.periods[i-1][1]);if(g>0)h+='<div class="gap">הפסקה · '+g+' דק׳</div>'}
  h+='<div class="row"><div class="num">'+(i+1)+'</div><input type="time" value="'+p[0]+'" onchange="setT('+i+',0,this.value)"><input type="time" value="'+p[1]+'" onchange="setT('+i+',1,this.value)"><button class="x" onclick="delP('+i+')">×</button></div>';
 });
 h+='</div><button class="btn" onclick="addP()">+ הוסף שיעור</button><div class="sec">ספירה לאחור</div><div class="rows"><div class="row"><input type="text" value="'+esc(S.endLbl||'סוף שנת הלימודים')+'" oninput="S.endLbl=this.value;save()"><input type="date" value="'+(S.end||'2027-06-20')+'" onchange="S.end=this.value;save()"></div></div><p class="hint">הנתונים נשמרים במכשיר שלך. כדי שההגדרות יישארו, הזן אותן באפליקציה שנפתחת מהאייקון במסך הבית.</p><button class="btn red" onclick="if(confirm(\'לאפס את כל המערכת?\')){S=def();save();render()}">איפוס למערכת לדוגמה</button>';
 $a(h);
}
function setX(k,i,v){S[k]=S[k]||[];(S[k][sd]=S[k][sd]||[])[i]=v;save()}
function setSub(i,v){(S.subjects[sd]=S.subjects[sd]||[])[i]=v;save()}
function setT(i,j,v){S.periods[i][j]=v;save();render()}
function addP(){var l=S.periods[S.periods.length-1],s=tm(l?l[1]:'08:00')+5,e=s+45,f=function(m){m=Math.min(m,1439);return pad(Math.floor(m/60))+':'+pad(m%60)};S.periods.push([f(s),f(e)]);save();render()}
function delP(i){if(S.periods.length<2)return;S.periods.splice(i,1);['subjects','room','teach'].forEach(function(k){(S[k]||[]).forEach(function(a){if(a)a.splice(i,1)})});save();render()}
function render(){
 var T=[['now','⏱️','עכשיו'],['week','📅','מערכת'],['ex','📝','לוח שנה'],['bus','🚌','אוטובוס'],['set','⚙️','הגדרות']];
 document.getElementById('nav').innerHTML=T.map(function(t){return '<button class="'+(view==t[0]?'on':'')+'" onclick="view=\''+t[0]+'\';render();scrollTo(0,0)"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('');
 if(view=='now')renderNow();else if(view=='week')renderWeek();else if(view=='ex')renderEx();else if(view=='bus')renderBus();else renderSet();
}
setInterval(function(){if(view=='now')renderNow()},1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&view=='now')renderNow()});
try{var c=document.createElement('canvas');c.width=c.height=180;var x=c.getContext('2d'),g=x.createLinearGradient(0,0,180,180);g.addColorStop(0,'#0a84ff');g.addColorStop(1,'#5e5ce6');x.fillStyle=g;x.fillRect(0,0,180,180);x.strokeStyle='#fff';x.lineWidth=10;x.lineCap='round';x.beginPath();x.arc(90,90,56,0,7);x.stroke();x.beginPath();x.moveTo(90,90);x.lineTo(90,56);x.moveTo(90,90);x.lineTo(114,102);x.stroke();var l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l)}catch(e){}
render();
